<VirtualHost *:80>
    ServerName sms-daemon.example.com
    DocumentRoot /opt/SMS-Handler/src/Web

    <Directory /opt/SMS-Handler/src/Web>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # Custom log format to include processing time
    LogFormat "%h %l %u %t \"%r\" %>s %b \"%{Referer}i\" \"%{User-Agent}i\" %D" combined_with_time
    ErrorLog ${APACHE_LOG_DIR}/sms_daemon_error.log
    CustomLog ${APACHE_LOG_DIR}/sms_daemon_access.log combined_with_time

    # Security: Deny access to everything except the Web directory
    # Note: This is an example, ensure your filesystem permissions are correct
    <Directory /opt/SMS-Handler/src>
        Require all denied
    </Directory>
    <Directory /opt/SMS-Handler/src/Web>
        Require all granted
    </Directory>

    # Optional: Enable HMAC signature checking for webhooks
    # The webhook.php script handles this internally if configured in config.php
</VirtualHost>
